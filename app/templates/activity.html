{% extends "base.html" %}{% block title %}Activity · PyCompiler{% endblock %}{% block body_class %}colab dash{% endblock %}{% block head %}<link rel="stylesheet" href="/static/css/colab.css?v={{ asset_v() }}"><link rel="stylesheet" href="/static/css/dashboard.css?v={{ asset_v() }}">{% endblock %}{% block content %}<header class="cb-topbar"><a class="cb-btn" href="{{ back }}">← Back</a><span class="cb-title">Full activity history</span><div class="cb-spacer"></div><span class="cb-user">{{ name }}</span></header><main class="dash-main"><section class="panel"><div class="panel-body"><ul class="feed history" id="activity-list"></ul></div></section></main><script>fetch('/api/dashboard/activity').then(r=>r.json()).then(x=>{document.getElementById('activity-list').innerHTML=x.map(a=>`<li><span class="icon">•</span><div>${a.summary}<time>${new Date(a.created_at).toLocaleString()}</time></div></li>`).join('')||'<li>No activity yet.</li>'})</script>{% endblock %}
