<!DOCTYPE html>
<html lang="en" data-theme="{{ theme|default('system', true) }}" data-theme-source="{{ theme_source|default('anonymous', true) }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Python Learning Platform{% endblock %}</title>
  <script>
    // A signed-in account is authoritative: the server already stamped it, and
    // this only keeps localStorage in step so the Settings picker agrees.
    // localStorage is consulted ONLY for a visitor with no account to read.
    (function () {
      var root = document.documentElement;
      var server = root.getAttribute("data-theme");
      try {
        if (root.getAttribute("data-theme-source") === "account") {
          localStorage.setItem("theme", server);
          return;
        }
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark" || saved === "system") {
          root.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128013;</text></svg>">
  <link rel="stylesheet" href="/static/css/styles.css?v={{ asset_v() }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
